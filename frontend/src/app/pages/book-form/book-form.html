<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-4">
          @if (bookId) {
            <i class="fa-solid fa-pen"></i> Redigera bok
          } @else {
            <i class="fa-solid fa-plus"></i> Lägg till ny bok
          }
        </h1>

        @if (errorMessage) {
          <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <form #bookForm="ngForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="title" class="form-label">Titel</label>
            <input id="title" name="title" class="form-control"
                   [(ngModel)]="book.title" required>
          </div>

          <div class="mb-3">
            <label for="author" class="form-label">Författare</label>
            <input id="author" name="author" class="form-control"
                   [(ngModel)]="book.author" required>
          </div>

          <div class="mb-4">
            <label for="publishedDate" class="form-label">Publiceringsdatum</label>
            <input id="publishedDate" name="publishedDate" type="date" class="form-control"
                   [(ngModel)]="book.publishedDate" required>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" [disabled]="bookForm.invalid">
              <i class="fa-solid fa-floppy-disk"></i> Spara
            </button>
            <a routerLink="/" class="btn btn-outline-secondary">
              <i class="fa-solid fa-xmark"></i> Avbryt
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
