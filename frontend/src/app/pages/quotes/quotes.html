<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <h1 class="h3 mb-0"><i class="fa-solid fa-quote-left"></i> Mina citat</h1>
  @if (!showForm) {
    <button class="btn btn-primary" (click)="openNew()">
      <i class="fa-solid fa-plus"></i> Lägg till nytt citat
    </button>
  }
</div>

@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

@if (showForm) {
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h2 class="h5 mb-3">
        @if (editingId) {
          <i class="fa-solid fa-pen"></i> Redigera citat
        } @else {
          <i class="fa-solid fa-plus"></i> Nytt citat
        }
      </h2>

      <form #quoteForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="text" class="form-label">Citat</label>
          <textarea id="text" name="text" class="form-control" rows="2"
                    [(ngModel)]="form.text" required></textarea>
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">Vem sa det?</label>
          <input id="author" name="author" class="form-control"
                 [(ngModel)]="form.author" required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="quoteForm.invalid">
            <i class="fa-solid fa-floppy-disk"></i> {{ editingId ? 'Uppdatera' : 'Spara' }}
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="cancelEdit()">
            <i class="fa-solid fa-xmark"></i> Avbryt
          </button>
        </div>
      </form>
    </div>
  </div>
}

<div class="row row-cols-1 row-cols-md-2 g-3">
  @for (quote of quotes; track quote.id) {
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <blockquote class="blockquote mb-0">
            <p>"{{ quote.text }}"</p>
            <footer class="blockquote-footer mt-1">{{ quote.author }}</footer>
          </blockquote>
        </div>
        <div class="card-footer bg-transparent d-flex gap-2">
          <button (click)="startEdit(quote)" class="btn btn-outline-secondary btn-sm">
            <i class="fa-solid fa-pen"></i> Redigera
          </button>
          <button (click)="deleteQuote(quote)" class="btn btn-outline-danger btn-sm">
            <i class="fa-solid fa-trash"></i> Radera
          </button>
        </div>
      </div>
    </div>
  } @empty {
    <div class="col-12">
      <p class="text-body-secondary">Inga citat än. Lägg till ditt första!</p>
    </div>
  }
</div>
